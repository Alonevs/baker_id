[package]
name = "forge-scene"
version = "1.0.0"
edition = "2021"
authors = ["Forge Team"]
description = "Forge Scene - Editor de escenas"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
forge-physics = { path = "../forge-physics" }
forge-animation = { path = "../forge-animation" }
forge-export = { path = "../forge-export" }

[lib]
name = "forge_scene"
path = "src/lib.rs"





