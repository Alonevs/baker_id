[package]
name = "forge-core"
version = "1.0.0"
edition = "2021"
authors = ["Forge Team"]
description = "Forge Core - Runtime del motor"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
