[package]
name = "forge-export"
version = "1.0.0"
edition = "2021"
authors = ["Forge Team"]
description = "Forge Export - Sistema de exportación multiplataforma"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
walkdir = "2.4"
zip = "0.6"
tempfile = "3.8"
rand = "0.8"
