[package]
name = "forge"
version = "1.0.0"
edition = "2021"
authors = ["Forge Team"]
description = "Forge Game Engine"
license = "MIT"

[workspace]
members = [
      "forge-editor",
      "forge-scene",
      "forge-physics",
      "forge-animation",
      "forge-export",
      "forge-resource",
      "forge-project",
      "forge-linter",
      "forge-runtime",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
eframe = { version = "0.33.3", default-features = false, features = ["wgpu"] }
egui = "0.33.3"
wgpu = { version = "27.0.1", features = ["dx12"] }
thiserror = "2.0"
notify = "6.1"
toml = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
chrono = "0.4"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
notify = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
chrono = { workspace = true }
forge-scene = { path = "forge-scene" }
forge-physics = { path = "forge-physics" }
forge-animation = { path = "forge-animation" }
forge-export = { path = "forge-export" }
forge-resource = { path = "forge-resource" }
forge-project = { path = "forge-project" }
forge-linter = { path = "forge-linter" }
forge-runtime = { path = "forge-runtime" }
